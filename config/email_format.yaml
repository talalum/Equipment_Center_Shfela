# Rules for parsing the issuance email.
#
# The rules live here and not in the code, so that a small change to the email
# format does not require a redeploy.
# After every change here — run the tests and paste a real email on the /paste
# screen to verify.

# The item list is read between its heading and the first matching end anchor.
items_start: "המוצרים שהונפקו:"
items_end:
  - "שם המנפיק:"
  - "בברכה"

# Every non-empty line between the anchors must match this expression, otherwise
# the whole issuance goes to review and does not enter stock.
item_line: '^(?P<name>.+?),\s*מק["״]?ט:\s*(?P<sku>[\w\-.]+)\s*[-–—]\s*כמות:\s*(?P<qty>\d+)\s*$'

# Single fields. Scanned across the whole email body.
issuer: '^\s*שם המנפיק:\s*(?P<issuer>.+?)\s*$'
center: '^\s*מרכז ציוד:\s*(?P<center>.+?)\s*$'
# "שלום וברכה" is a greeting, not a recipient name.
recipient: '^\s*שלום\s+(?!וברכה\s*$)(?P<recipient>.+?)\s*$'

# An email whose equipment center is not this one is stored as ignored and does
# not touch stock.
# Leave empty to accept from every center.
expected_center: "מרכז ציוד שפלה"

# A regular issuance says "ההזמנה שלך מוכנה". An organizational issuance says
# "ההזמנה על <unit> מוכנה"; the named unit becomes the recipient.
# This is a regular expression. Leave it empty to identify an issuance only by
# the item-list anchor.
issuance_marker: 'ההזמנה (?:שלך|על\s+(?P<unit>.{1,80}?)) מוכנה'

# Organizational issuances do not contain an equipment-center line. When this
# is true, a valid organizational issuance is treated as belonging to the
# expected center. Other emails without a center still wait for manual review.
organizational_is_ours: true
