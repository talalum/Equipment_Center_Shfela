# Rules for parsing the issuance email.
#
# The rules live here and not in the code, so that a small change to the email
# format does not require a redeploy.
# After every change here — run the tests and paste a real email on the /paste
# screen to verify.

# The item list is read between these two anchors. Both must be present.
items_start: "המוצרים שהונפקו:"
items_end: "שם המנפיק:"

# Every non-empty line between the anchors must match this expression, otherwise
# the whole issuance goes to review and does not enter stock.
item_line: '^(?P<name>.+?),\s*מק["״]?ט:\s*(?P<sku>[\w\-.]+)\s*[-–—]\s*כמות:\s*(?P<qty>\d+)\s*$'

# Single fields. Scanned across the whole email body.
issuer: '^\s*שם המנפיק:\s*(?P<issuer>.+?)\s*$'
center: '^\s*מרכז ציוד:\s*(?P<center>.+?)\s*$'
recipient: '^\s*שלום\s+(?P<recipient>.+?)\s*$'

# An email whose equipment center is not this one is stored as ignored and does
# not touch stock.
# Leave empty to accept from every center.
expected_center: "מרכז ציוד שפלה"
