# כללי פירוק מייל ההנפקה.
#
# הכללים כאן ולא בקוד, כדי ששינוי קל בתבנית המייל לא ידרוש דיפלוי מחדש.
# אחרי כל שינוי כאן — להריץ את הטסטים ולהדביק מייל אמיתי במסך /paste כדי לאמת.

# רשימת הפריטים נקראת בין שני העוגנים האלה. שניהם חייבים להופיע.
items_start: "המוצרים שהונפקו:"
items_end: "שם המנפיק:"

# כל שורה לא ריקה בין העוגנים חייבת להתאים לביטוי הזה, אחרת כל ההנפקה
# עוברת לביקורת ולא נכנסת למלאי.
item_line: '^(?P<name>.+?),\s*מק["״]?ט:\s*(?P<sku>[\w\-.]+)\s*[-–—]\s*כמות:\s*(?P<qty>\d+)\s*$'

# שדות יחידים. נסרקים על כל גוף המייל.
issuer: '^\s*שם המנפיק:\s*(?P<issuer>.+?)\s*$'
center: '^\s*מרכז ציוד:\s*(?P<center>.+?)\s*$'
recipient: '^\s*שלום\s+(?P<recipient>.+?)\s*$'

# מייל שמרכז הציוד שלו אינו זה — נשמר כ-ignored ולא נוגע במלאי.
# להשארה ריקה כדי לקלוט מכל המרכזים.
expected_center: "מרכז ציוד שפלה"
